name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, config (redact secrets), and the smallest store that shows it.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `smem version` and `smem doctor`
      render: text
